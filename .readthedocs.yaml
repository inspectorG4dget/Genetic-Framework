version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python pyvolution/Documentation/sync_version.py

sphinx:
  configuration: pyvolution/Documentation/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: pyvolution/Documentation/requirements.txt
